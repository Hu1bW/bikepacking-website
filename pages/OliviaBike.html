<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/app.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="logo">MBO</div>
      <nav class="nav">
        <a href="/index.html">Home</a>
        <a href="/pages/MyLearnings.html">Learnings</a>
        <a href="#">Bike</a>
        <a href="/pages/MyTravels.html">Logs</a>
      </nav>
    </header>

    <section class="hero3">
      <div class="hero3-bg">
        <img
          src="../assets/images/Touring920.png"
          alt="Bike"
          class="bike-img"
        />

        <div class="clipped-div-steering">
          <span class="highlight-text">Steering Wheel</span>
        </div>

        <div class="clipped-div-framebag">
          <span class="highlight-text">Frame Bag</span>
        </div>

        <div class="clipped-div-fork">
          <span class="highlight-text">Fork</span>
        </div>

        <div class="clipped-div-frame">
          <span class="highlight-text">Frame</span>
        </div>

        <div class="clipped-div-seat">
          <span class="highlight-text">Seat</span>
        </div>

        <div class="clipped-div-chain">
          <span class="highlight-text">Chain</span>
        </div>

        <div class="clipped-div-paddle">
          <span class="highlight-text">Paddle</span>
        </div>

        <div class="clipped-div-front-wheel">
          <span class="highlight-text">Front Wheel</span>
        </div>

        <div class="clipped-div-back-wheel">
          <span class="highlight-text">Back Wheel</span>
        </div>
      </div>

      <!-- Popup container -->
      <div id="popup" class="popup hidden">
        <div class="popup-content-wrapper">
          <span id="popup-close">&times;</span>
          <div class="popup-content">
            <!-- Hier wordt de template inhoud ingevoegd -->
          </div>
        </div>
      </div>

      <!-- Template -->
      <template id="clipped-div-steering-template">
        <h2>The steering wheel</h2>
        <h4>And the bagage mount and options I use</h4>

        <!-- Eerste sectie -->
        <div class="popup-row">
          <div class="popup-img-lg">
            <img
              src="../assets/images/SteeringWheelImgPopup.png"
              alt="steeringWheel"
              class="popup-img-lg"
            />
          </div>
          <div class="popup-text">
            <p>
              The steering wheel I use is a brand and model. I have been using
              this since I purchased the bike in 2024.
            </p>
            <p>
              The steering wheel is similair to a trackbike's steering wheel in
              shape. The difference is that it is more robust and the curly ends
              of the steering wheel rotate outwords where a trackbike's steering
              wheel goes down only.
            </p>
            <p>
              Because of this, there is more room for bagage mounts and bags,
              which bikepackers are almost always in desperate need of.
            </p>
          </div>
        </div>

        <!-- Tweede sectie -->
        <div class="popup-section">
          <h3>The thing that hang from my steering wheel</h3>
          <div class="popup-grid">
            <div class="popup-img-md">
              <img
                src="../assets/images/stuurHarnas.avif"
                alt="bagFrame"
                class="popup-img-md"
              />
            </div>
            <div class="popup-col">
              <div class="popup-img-sm">
                <img
                  src="../assets/images/stuurtasKlikbaarImgPopup.png"
                  alt="stuurtas"
                  class="popup-img-sm"
                />
              </div>
              <div class="popup-img-sm">
                <img
                  src="../assets/images/Velo2.png"
                  alt="velo2"
                  class="popup-img-sm"
                />
              </div>
            </div>
            <div class="popup-col">
              <div class="popup-img-sm">
                <img
                  src="../assets/images/Drybag16L.png"
                  alt="drybag"
                  class="popup-img-sm"
                />
              </div>
              <div class="popup-img-sm">
                <img
                  src="../assets/images/BottleHolder.png"
                  alt="bottleHolder"
                  class="popup-img-sm"
                />
              </div>
            </div>
            <ul class="popup-list">
              <li>
                <a
                  href="https://www.decathlon.nl/p/stuurharnas-voor-fietstocht-advt-900/_/R-p-357948?mc=8912323&c=Zwart"
                  >ROCKRIDER ADVT 900 bagmount</a
                >
              </li>
              <li>
                <a
                  href="https://www.decathlon.nl/p/mp/topeak/topeak-frontloader-tas-l-zwart-ideale-bikepacking-tas/_/R-p-84faf679-89c3-4798-9e6a-227b0500409e"
                  >Drybag 16L</a
                >
              </li>
              <li>
                <a
                  href="https://www.decathlon.nl/p/waterdichte-stuurtas-voor-fietstochten-advt-900-ipx3-3-5-liter/_/R-p-357949?mc=8912333&c=Beige"
                  >Attachable bag</a
                >
                to mount in front
              </li>
              <li>
                <a
                  href="https://www.decathlon.nl/p/bidonhouder-voor-fietsstuur/_/R-p-168751?mc=8487122&c=Zwart"
                  >Bottle holder</a
                >
              </li>
              <li>
                <a
                  href="https://www.mantel.com/beeline-velo-2-fietsnavigatie?channable=41b38e696400312d3134333334332d323836383239e7&spec%5B%5D=20107&utm_source=google&utm_medium=cpc&utm_content=shopping&gad_source=1&gad_campaignid=17918915028&gbraid=0AAAAADoCglOdFUqCKMaIZ6DXnpbDSSHqk&gclid=Cj0KCQjw8eTFBhCXARIsAIkiuOxhj9lh849xUUGIRqa23KGoV8iVzr40f-LeEZ4YutdJ4-oijKE0HycaAj8yEALw_wcB"
                  >Beelinie Velo 2</a
                >
              </li>
              <li>Some offbrand mount for my phone</li>
              <li>Bridget the white ladybug</li>
            </ul>
          </div>
        </div>

        <!-- Derde sectie -->
        <div class="popup-section">
          <h3>My bags</h3>
          <div class="popup-text">
            <p>I always take my sleeping gear with me on my steering wheel.</p>
            <p>
              The following items are always here and I always have room for
              more things that I buy along the way, like groceries or a jacket
              that needs to come off.
            </p>
          </div>
          <div class="popup-grid">
            <div class="popup-img-md"></div>
            <div class="popup-col">
              <div class="popup-img-sm"></div>
              <div class="popup-img-sm"></div>
            </div>
            <ul class="popup-list">
              <li>Tent</li>
              <li>Sleeping Bag</li>
              <li>Inflatable pillow</li>
              <li>Inflatable bed</li>
            </ul>
          </div>
        </div>
      </template>

      <!-- Frame Bag -->
      <template id="clipped-div-framebag-template">
        <h2>Frame Bag</h2>
        <img
          src="../assets/images/FrameBag.png"
          alt="Frame Bag"
          class="popup-img-xlg"
        />
        <p>
          I do not have a 10 thousand euro bike, so there are no extra secret
          frame comparements. Because of this, I need to use the space in my
          bikeframe for more room for luggage. I use a frame bag that fits
          perfectly in my bike frame. It has a volume of 6 liters and it is
          waterproof.
        </p>
        <p>
          <a
            href="https://www.decathlon.nl/p/frametas-voor-bikepacking-advt-900-full-frame-spatwaterdicht-ipx3-6-liter/_/R-p-357776"
            >ADTV 900 Full Frame</a
          >
        </p>

        <p>
          I use this bag to keep my groceries, I found that this space holds
          enough room for at least 3 days of groceries. I also use this bag to
          keep my tools and spare parts for my bike.
        </p>
      </template>

      <!-- Fork -->
      <template id="clipped-div-fork-template">
        <h2>Voorvork en accessoires</h2>
        <div class="popup-gallery">
          <div class="popup-img-sm"></div>
          <div class="popup-img-sm"></div>
        </div>
        <p>
          De vork biedt ruimte voor extra cages of dry bags. Perfect om gewicht
          voorop de fiets te dragen.
        </p>
      </template>

      <!-- Frame -->
      <template id="clipped-div-frame-template">
        <h2>Frame</h2>
        <p>
          Het hart van de fiets. Hier draag ik de meeste bagage in tassen of
          bidons.
        </p>
        <ul>
          <li>Sterk en licht aluminium</li>
          <li>Bevestigingspunten voor bidonhouders</li>
          <li>Stabiel tijdens lange ritten</li>
        </ul>
      </template>

      <!-- Seat -->
      <template id="clipped-div-seat-template">
        <h2>Zadel en zadeltas</h2>
        <div class="popup-row">
          <div class="popup-img-md"></div>
          <div>
            <p>
              De zadeltas gebruik ik voor lichte, maar volumineuze spullen zoals
              kleding of slaapspullen.
            </p>
          </div>
        </div>
      </template>

      <!-- Chain -->
      <template id="clipped-div-chain-template">
        <h2>Ketting en aandrijving</h2>
        <img
          src="../assets/images/chain.jpg"
          alt="Chain"
          class="popup-img-md"
        />
        <p>
          Betrouwbaar schakelen is essentieel tijdens lange reizen. Regelmatig
          schoonmaken voorkomt slijtage.
        </p>
      </template>

      <!-- Paddle -->
      <template id="clipped-div-paddle-template">
        <h2>Pedaal</h2>
        <p>Ik gebruik stevige flat pedals met grip, ideaal voor bikepacking.</p>
        <p>
          Voordeel: ik kan op gewone schoenen fietsen, handig tijdens stops.
        </p>
      </template>

      <!-- Front Wheel -->
      <template id="clipped-div-front-wheel-template">
        <h2>Voorwiel</h2>
        <div class="popup-img-lg"></div>
        <p>Stevig wiel met 32 spaken, geschikt voor onverharde wegen.</p>
      </template>

      <!-- Back Wheel -->
      <template id="clipped-div-back-wheel-template">
        <h2>Achterwiel</h2>
        <p>
          Het achterwiel draagt de meeste belasting. Hier monteer ik ook de
          aandrijving en vaak extra bagage.
        </p>
      </template>
    </section>
  </body>
</html>
